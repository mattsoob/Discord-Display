<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Glass Overlay</title>
  <style>
    :root {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --accent-blurple: #5865f2;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --text-positive: #23a55a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-tertiary);
      color: var(--text-normal);
      display: flex;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Server Rail */
    .servers-sidebar {
      width: 72px;
      background-color: var(--bg-tertiary);
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-right: 1px solid #111214;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-normal);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .server-icon:hover {
      border-radius: 16px;
      background-color: var(--accent-blurple);
      color: #fff;
    }

    /* Main Container */
    .app-container {
      flex: 1;
      display: flex;
      background-color: var(--bg-primary);
    }

    /* Channel / Voice Panel */
    .content-area {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* Voice Speakers Grid */
    .speaker-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background-color: var(--bg-secondary);
      border-radius: 8px;
      margin-bottom: 6px;
      border: 2px solid transparent;
    }

    .speaker-card.speaking {
      border-color: var(--text-positive);
    }

    .avatar-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--accent-blurple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .channel-group {
      background-color: var(--bg-secondary);
      border-radius: 8px;
      padding: 12px;
    }

    .channel-header {
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Left Guild Sidebar -->
  <div class="servers-sidebar" id="servers-list">
    <!-- Guild icons render here -->
  </div>

  <!-- Main Content View -->
  <div class="app-container">
    <div class="content-area">
      <div class="section-title">Voice Channels</div>
      <div id="voice-speakers">
        <!-- Voice channels & members render here -->
      </div>
    </div>
  </div>

  <script>
    const wsUrl = 'ws://localhost:8080';
    const socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      console.log('[HUD] Connected to local bridge server');
      socket.send(JSON.stringify({ type: 'FETCH_SERVERS' }));
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleServerEvent(data);
    };

    socket.onclose = () => {
      console.warn('[HUD] Disconnected from bridge server. Reconnecting...');
      setTimeout(() => location.reload(), 5000);
    };

    function handleServerEvent(data) {
      switch (data.type) {
        case 'INITIAL_SYNC':
        case 'SERVER_LIST':
          renderSidebar(data.guilds);
          break;
        case 'VOICE_CHANNELS_LIST':
          renderVoiceChannels(data.voiceChannels);
          break;
        case 'VOICE_STATE_CHANGE':
          console.log(`[HUD] Voice event: ${data.event} for ${data.username}`);
          break;
      }
    }

    function renderSidebar(guilds) {
      const container = document.getElementById('servers-list');
      if (!container || !guilds) return;

      container.innerHTML = guilds.map(guild => {
        const initials = guild.name.split(' ').map(n => n[0]).join('').slice(0, 3);
        return `
          <div class="server-icon" onclick="fetchVoiceChannels('${guild.id}')" title="${guild.name}">
            ${initials}
          </div>
        `;
      }).join('');
    }

    function fetchVoiceChannels(guildId) {
      socket.send(JSON.stringify({ type: 'FETCH_VOICE_CHANNELS', guildId }));
    }

    function renderVoiceChannels(channels) {
      const container = document.getElementById('voice-speakers');
      if (!container || !channels) return;

      container.innerHTML = channels.map(channel => `
        <div class="channel-group">
          <div class="channel-header">🔊 ${channel.name}</div>
          ${channel.members.map(member => `
            <div class="speaker-card ${member.isSpeaking ? 'speaking' : ''}">
              <div class="avatar-placeholder">${member.username[0].toUpperCase()}</div>
              <div>${member.username}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
