<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Glass Frontend</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1117;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    #servers-list, #voice-speakers {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="servers-list"></div>
  <div id="voice-speakers"></div>

  <script>
    /* Discord Glass Frontend Client */
    const wsUrl = 'ws://localhost:8080';
    const socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      console.log('[HUD] Connected to local bridge server');
      // Request initial data once connected
      socket.send(JSON.stringify({ type: 'FETCH_SERVERS' }));
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleServerEvent(data);
    };

    socket.onclose = () => {
      console.warn('[HUD] Disconnected from bridge server. Reconnecting...');
      setTimeout(() => location.reload(), 5000);
    };

    function handleServerEvent(data) {
      switch (data.type) {
        case 'INITIAL_SYNC':
          renderSidebar(data.guilds);
          break;
        case 'SERVER_LIST':
          renderSidebar(data.guilds);
          break;
        case 'VOICE_CHANNELS_LIST':
          renderVoiceChannels(data.voiceChannels);
          break;
        case 'VOICE_STATE_CHANGE':
          console.log(`[HUD] Voice event: ${data.event} for ${data.username}`);
          // Auto-refresh the active voice channel list
          break;
      }
    }

    function renderSidebar(guilds) {
      const container = document.getElementById('servers-list');
      if (container) {
        container.innerHTML = guilds.map(guild => `<div>${guild.name}</div>`).join('');
      }
    }

    function fetchVoiceChannels(guildId) {
      socket.send(JSON.stringify({ type: 'FETCH_VOICE_CHANNELS', guildId }));
    }

    function renderVoiceChannels(channels) {
      const container = document.getElementById('voice-speakers');
      if (container) {
        container.innerHTML = channels.map(channel => `
          <div>
            ${channel.name} ${channel.members.map(member => `
              <div>${member.username}</div>
            `).join('')}
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
